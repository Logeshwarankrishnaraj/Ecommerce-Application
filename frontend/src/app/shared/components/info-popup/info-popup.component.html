<div class="stack" aria-live="polite">
  @for (m of info.messages(); track m.id) {
    <div class="pop" [class]="'pop ' + m.kind" [attr.role]="m.kind === 'error' ? 'alert' : 'status'">
      <svg class="badge" viewBox="0 0 40 40" aria-hidden="true">
        <polygon points="20.00,1.00 23.60,4.21 28.24,2.88 30.10,7.33 34.85,8.15 34.60,12.97 38.52,15.77 36.20,20.00 38.52,24.23 34.60,27.03 34.85,31.85 30.10,32.67 28.24,37.12 23.60,35.79 20.00,39.00 16.40,35.79 11.76,37.12 9.90,32.67 5.15,31.85 5.40,27.03 1.48,24.23 3.80,20.00 1.48,15.77 5.40,12.97 5.15,8.15 9.90,7.33 11.76,2.88 16.40,4.21" stroke-linejoin="round" />
        @switch (m.kind) {
          @case ('success') { <path d="M12.5 20.5l5 5 10-11" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" /> }
          @case ('error') { <path d="M20 11.5v10" stroke="#fff" stroke-width="3.6" stroke-linecap="round" /><circle cx="20" cy="27.5" r="2.1" fill="#fff" /> }
          @case ('warn') { <path d="M20 11.5v10" stroke="#fff" stroke-width="3.6" stroke-linecap="round" /><circle cx="20" cy="27.5" r="2.1" fill="#fff" /> }
          @default { <circle cx="20" cy="12.5" r="2.1" fill="#fff" /><path d="M20 18.5v10" stroke="#fff" stroke-width="3.6" stroke-linecap="round" /> }
        }
      </svg>
      <div class="body">
        <p class="title">{{ m.title }}</p>
        <p class="text">{{ m.text }}</p>
      </div>
      <button type="button" class="close" aria-label="Dismiss message" (click)="info.dismiss(m.id)">×</button>
      <span class="bar" [style.animation-duration.ms]="m.ttl"></span>
    </div>
  }
</div>
