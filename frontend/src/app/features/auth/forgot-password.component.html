<section class="card narrow">
  <h1>Reset your password</h1>
  @if (step() === 1) {
    <form class="form" [formGroup]="request" (ngSubmit)="send()" novalidate>
      <div class="field" [class.invalid]="m(request, 'email')">
        <label for="em">Email</label>
        <input id="em" class="input" type="email" formControlName="email" autocomplete="email" />
        @if (m(request, 'email'); as x) { <span class="err">{{ x }}</span> }
      </div>
      <button class="btn btn-primary" type="submit" [disabled]="busy()">Send reset code</button>
    </form>
    <p class="small"><button type="button" class="link-btn" (click)="step.set(2)">I already have a code</button></p>
  } @else {
    <form class="form" [formGroup]="complete" (ngSubmit)="finish()" novalidate>
      <div class="field" [class.invalid]="m(complete, 'email')">
        <label for="em2">Email</label>
        <input id="em2" class="input" type="email" formControlName="email" />
        @if (m(complete, 'email'); as x) { <span class="err">{{ x }}</span> }
      </div>
      <div class="field" [class.invalid]="m(complete, 'code')">
        <label for="cd">Code</label>
        <input id="cd" class="input" inputmode="numeric" maxlength="6" formControlName="code" />
        @if (m(complete, 'code'); as x) { <span class="err">{{ x }}</span> }
      </div>
      <div class="field" [class.invalid]="m(complete, 'newPassword')">
        <label for="np">New password</label>
        <input id="np" class="input" type="password" autocomplete="new-password" formControlName="newPassword" />
        @if (m(complete, 'newPassword'); as x) { <span class="err">{{ x }}</span> }
      </div>
      <button class="btn btn-primary" type="submit" [disabled]="busy()">Set new password</button>
    </form>
  }
  <p class="small"><a routerLink="/login">Back to sign in</a></p>
</section>
