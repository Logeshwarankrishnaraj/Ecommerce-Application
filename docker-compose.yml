# Local development dependencies only: MySQL 8 and MailHog (catches outgoing email at http://localhost:8025).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jewel_store
      MYSQL_USER: jewel_app
      MYSQL_PASSWORD: jewel_local_pw
      MYSQL_ROOT_PASSWORD: root_local_pw
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local_pw"]
      interval: 5s
      retries: 20
  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]
volumes:
  mysql-data:
