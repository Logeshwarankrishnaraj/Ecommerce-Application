# Production-safe defaults. Secrets come from environment variables only (see .env.example).
spring:
  application:
    name: commerce
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jewel_store}?serverTimezone=UTC&useSSL=${DB_USE_SSL:true}
    username: ${DB_USERNAME:jewel_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none            # schema is owned by Flyway migrations only
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 40MB
      max-request-size: 40MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
  error:
    include-stacktrace: never
    include-message: never

# API docs are OFF unless a profile (or SWAGGER_ENABLED=true) turns them on; application-local.yml enables them for development.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:4200}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  mail:
    from-email: ${SMTP_FROM_EMAIL:no-reply@jewelstore.local}
    log-only: false
    admin-alert-emails: ${ADMIN_ALERT_EMAILS:}
  otp:
    ttl-seconds: 600
    max-attempts: 5
    resend-cooldown-seconds: 60
    max-resends: 5
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./var/media}
    max-file-bytes: 5242880
    max-dimension: 6000
  payment:
    mode: ${PAYMENT_MODE:disabled}
    mock-enabled: ${PAYMENT_MOCK_ENABLED:false}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
  errors:
    dedupe-window-minutes: 15
    alert-min-severity: ERROR
  seed:
    demo-accounts: false
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
